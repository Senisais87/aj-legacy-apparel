name: Install approved AJ Legacy collection images
on:
  push:
    paths:
      - '.github/workflows/install-collection-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve approved uploaded artwork
        run: |
          mkdir -p line-images
          BASE='https://headless-gdsjykzadce-asenisais-1409.wix-site-host.com/line-images'
          for file in law-enforcement athletics corrections memorial; do
            curl --fail --location --retry 3 --silent --show-error "$BASE/$file.jpg" -o "line-images/$file.jpg"
            test "$(wc -c < "line-images/$file.jpg")" -gt 30000
          done
      - name: Replace only the four collection card images
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changes={'law':'law-enforcement','doc':'corrections','gym':'athletics','limited':'memorial'}
          for line,filename in changes.items():
              pattern=r'(<article\b[^>]*\bdata-line="'+line+r'"[^>]*>\s*<img\b[^>]*\bsrc=")[^"]*(")'
              s,n=re.subn(pattern,lambda m:m.group(1)+'line-images/'+filename+'.jpg'+m.group(2),s,count=1,flags=re.S)
              if n!=1:
                  raise RuntimeError(f'Expected one collection card image for {line}, found {n}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit artwork and homepage changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html line-images/
          if ! git diff --cached --quiet; then
            git commit -m "Replace collection line images with four approved designs"
            git push
          fi
